name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build web
        run: >
          flutter build web --release
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_ID=${{ github.sha }}

      - name: Prepare web deploy artifacts
        env:
          BUILD_ID: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: dart run tool/prepare_web_deploy.dart

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Deploy preview to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_BILLINGFRONTEND }}'
          projectId: billingfrontend
          channelId: pr-${{ github.event.pull_request.number }}
          firebaseToolsVersion: '15.22.3'
